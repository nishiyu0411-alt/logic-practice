<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6f91e8">
  <meta name="description" content="170 道逻辑推理题，支持手机与电脑同步进度、错题回练和提交后查看解析。">
  <title>逻辑推理刷题站</title>
  <link rel="stylesheet" href="./github-pages-styles.css">
  <script src="./github-pages-questions.js" defer></script>
  <script src="./github-pages-app.js" defer></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <h1>🧠 逻辑推理刷题站</h1>
        <p>粉蓝题库 · 提交看解析 · 跨设备同步 · 错题空白重练</p>
      </div>
      <div class="timerbox">
        <span>⏱</span><span id="timer" class="timer">00:00:00</span>
        <button id="timerToggle" class="ghost">暂停</button>
        <button id="timerReset" class="ghost">重置</button>
      </div>
    </header>

    <div class="grid">
      <aside class="panel">
        <div class="statgrid">
          <div class="stat blue"><b id="statDone">0</b><span>已作答</span></div>
          <div class="stat pink"><b id="statAcc">—</b><span>正确率</span></div>
          <div class="stat red"><b id="statWrong">0</b><span>错题</span></div>
          <div class="stat lilac"><b id="statFav">0</b><span>收藏</span></div>
        </div>

        <section class="section">
          <label class="small" for="mode">练习模式</label>
          <select id="mode">
            <option value="all">全部题目</option>
            <option value="unanswered">未做题</option>
            <option value="wrong">错题回练（空白重做）</option>
            <option value="favorite">收藏题</option>
          </select>
          <label class="small spaced" for="category">题库分区</label>
          <select id="category"></select>
          <div class="row spaced-row">
            <button id="shuffleBtn" class="secondary">🔀 随机顺序</button>
            <button id="resetOrderBtn" class="secondary">↕ 顺序刷题</button>
          </div>
        </section>

        <section class="section">
          <div class="progressline"><i id="progressbar"></i></div>
          <div class="micro"><span id="progressText">0 / 0</span><span id="saveTime">尚未作答</span></div>
        </section>

        <section class="section palette-section">
          <label class="small">题号导航</label>
          <div id="palette" class="palette"></div>
        </section>

        <section class="section sync-card">
          <label class="small" for="syncCode">☁️ 跨设备云同步</label>
          <div class="row sync-row">
            <input id="syncCode" class="textbtn" placeholder="输入同步码（至少8位）" autocomplete="off">
            <button id="syncBtn" class="secondary">同步</button>
          </div>
          <div id="syncStatus" class="saveNote">电脑和手机输入同一个同步码即可共享逻辑题进度。</div>
        </section>

        <section class="section">
          <button id="saveExit" class="primary full">💾 保存退出</button>
          <div class="row spaced-row">
            <button id="exportBtn" class="secondary">导出存档</button>
            <button id="importBtn" class="secondary">导入存档</button>
          </div>
          <button id="clearBtn" class="secondary danger full spaced-row">清空全部进度</button>
          <div class="saveNote">本机自动保存；设置同步码后也会自动保存到云端。</div>
        </section>
      </aside>

      <main id="quiz" class="quiz" aria-live="polite">
        <div class="empty"><div><div class="empty-icon">🫧</div><h3>正在打开逻辑题库…</h3></div></div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <input type="file" id="importFile" accept=".json" hidden>
</body>
</html>
